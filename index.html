<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPA Car Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000;
      background-image: radial-gradient(#111 1px, #000 1px);
      background-size: 20px 20px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    img.logo {
      width: 187px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 25px;
    }

    /* Location icon with pulse */
    .location-icon {
      width: 50px;
      height: 50px;
      padding: 10px;
      border-radius: 50%;
      background-color: #fff;
      object-fit: cover;
      margin: 10px 0 30px;
      cursor: pointer;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    .social-btn {
      width: 100%;
      background-color: #fff;
      color: #000;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .social-btn:hover {
      background-color: #f5f5f5;
      box-shadow: 0 0 10px 2px rgba(255, 0, 0, 0.5);
    }

    .social-btn img {
      width: 28px;
      margin-right: 14px;
    }

    @media (max-width: 480px) {
      .title {
        font-size: 24px;
      }

      .subtitle {
        font-size: 16px;
      }

      .social-btn {
        padding: 12px 16px;
        font-size: 16px;
      }

      .social-btn img {
        width: 24px;
      }

      img.logo {
        width: 120px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Logo -->
    <img src="logo.jpg" alt="SPA Logo" class="logo" />

    <!-- Title & Subtitle -->
    <div class="title">SPA</div>
    <div class="subtitle">Car Care</div>

    <!-- Location Icon -->
    <a href="https://www.google.com/maps/place/Car+gate+%D9%83%D8%A7%D8%B1+%D8%AC%D9%8A%D8%AA+%D9%84%D9%84%D8%B9%D9%86%D8%A7%D9%8A%D8%A9+%D8%A8%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%B1%D8%A7%D8%AA%E2%80%AD/@29.9727017,30.9467544,17z/data=!3m1!4b1!4m6!3m5!1s0x145857cce838f597:0xc91a5888b03a04e9!8m2!3d29.9727017!4d30.9467544!16s%2Fg%2F11vqlplk5l?entry=ttu" target="_blank">
      <img src="location.jpg" alt="Location" class="location-icon" />
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/_s.p.a_?igsh=MWNoYzl2eWxtdTlhcg==" target="_blank" class="social-btn">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384031.png" alt="Instagram">
      Instagram
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/share/167pWyvD6T/?mibextid=wwXIfr" target="_blank" class="social-btn">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384005.png" alt="Facebook">
      Facebook
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@s.p.a_car_care?_t=ZS-8vXD7ooAJOR&_r=1" target="_blank" class="social-btn">
      <img src="https://cdn-icons-png.flaticon.com/512/3669/3669950.png" alt="TikTok">
      TikTok
    </a>

  </div>

</body>
</html>
